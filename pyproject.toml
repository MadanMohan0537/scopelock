[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopelock"
version = "0.1.0"
description = "Least-privilege policy gateway for AI agent tools"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
scopelock = "scopelock.cli:main"

[tool.setuptools.packages.find]
include = ["scopelock*"]
